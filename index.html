<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tra Cứu DVC KBNN</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div id="loginSection" class="max-w-md mx-auto bg-white p-6 rounded shadow mt-20">
        <h2 class="text-xl font-bold mb-4 text-center">Đăng nhập Hệ thống</h2>
        <div class="mb-4">
            <label class="block font-semibold mb-1">Email</label>
            <input type="email" id="email" class="border p-2 rounded w-full" placeholder="admin@kho-bac.vn">
        </div>
        <div class="mb-4">
            <label class="block font-semibold mb-1">Mật khẩu</label>
            <input type="password" id="password" class="border p-2 rounded w-full" placeholder="******">
        </div>
        <button id="btnLogin" class="bg-blue-600 text-white w-full py-2 rounded hover:bg-blue-700 font-bold">
            Đăng nhập
        </button>
        <p id="loginError" class="text-red-500 text-sm mt-2 hidden">Sai tài khoản hoặc mật khẩu!</p>
    </div>

    <div id="appSection" class="max-w-6xl mx-auto bg-white p-6 rounded shadow hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">Tra Cứu Hồ Sơ Tài Liệu</h1>
            <button id="btnLogout" class="text-gray-500 hover:text-red-600 underline">Đăng xuất</button>
        </div>
        
        <div class="flex gap-4 mb-6 items-end">
            </div>

        </div>

    <script src="app.js"></script>
</body>
</html>
